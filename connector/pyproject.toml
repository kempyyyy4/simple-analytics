[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmcp"
version = "0.1.0"
description = "Read-only YouTube Analytics MCP server"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "google-auth", "google-auth-oauthlib", "google-api-python-client", "requests"]

[project.scripts]
ytmcp = "ytmcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
